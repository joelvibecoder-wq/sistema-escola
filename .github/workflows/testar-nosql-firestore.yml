name: CRUD NoSQL - Testes no Firestore Emulator
on:
  push:
    branches:
      - atividade-nosql-firestore-2026
    paths:
      - 'atividades/nosql-firestore/**'
      - '.github/workflows/testar-nosql-firestore.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atividades/nosql-firestore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes de validação e CRUD em memória
        run: npm test
      - name: Executar operações reais no SDK usando o emulador oficial
        env:
          FIREBASE_PROJECT_ID: demo-nosql-firestore
        run: |
          npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-nosql-firestore 'npm run test:emulador'
      - name: Gerar imagens dos logs executados
        run: |
          python3 -m pip install --user --quiet Pillow
          python3 scripts/gerar-imagens-evidencias.py
          test -f docs/evidencias-emulador/09-resumo.png
      - name: Guardar evidências no GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add atividades/nosql-firestore/docs/evidencias-emulador/
          if ! git diff --cached --quiet; then
            git commit -m 'docs: evidências geradas por testes no emulador Firestore'
            git push
          fi
        working-directory: .
