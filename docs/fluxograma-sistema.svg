<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1430" viewBox="0 0 1760 1430" role="img" aria-labelledby="title description"><title id="title">Diagrama lógico Kennedy Vota</title><desc id="description">Fluxo real do aplicativo escolar: perfis, PWA, servidor Express, PostgreSQL, etapas de cadastro, aprovação, criação e abertura de eleição, voto único e apuração. Inclui limitações de segurança. Nenhuma credencial pessoal é exibida.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8be1aa"/></marker></defs><rect width="1760" height="1430" fill="#091610"/><rect x="0" y="0" width="1760" height="148" fill="#0f3020"/><rect x="0" y="144" width="1760" height="4" fill="#69d79a"/><text x="76" y="74" font-family="DejaVu Sans,Arial,sans-serif" font-size="47" fill="#c8ffdb" font-weight="850" text-anchor="start">KENNEDY VOTA</text><text x="78" y="119" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" fill="#bedbc9" font-weight="500" text-anchor="start">Diagrama lógico do sistema • arquitetura e fluxo de votação</text><rect x="1388" y="36" width="295" height="73" rx="16" fill="#174b31" stroke="#4fba75" stroke-width="2" /><text x="1535" y="66" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#bff8d0" font-weight="800" text-anchor="middle">PROJETO EDUCACIONAL</text><text x="1535" y="94" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#e6fff0" font-weight="500" text-anchor="middle">Não é urna oficial</text><text x="82" y="203" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#9af2b7" font-weight="800" text-anchor="start">1. PERFIS E ACESSO</text><rect x="78" y="222" width="337" height="123" rx="18" fill="#18392a" stroke="#3b7954" stroke-width="2" /><text x="100" y="258" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#d2ffe0" font-weight="800" text-anchor="start">ALUNO</text><text x="100" 