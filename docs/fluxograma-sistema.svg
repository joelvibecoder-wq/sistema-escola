<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380">
<title>Fluxograma completo — Eleição Escolar</title>
<defs><style>.bg{fill:#f3faf4}.head{fill:#075c35}.box{fill:#fff;stroke:#25834c;stroke-width:3}.soft{fill:#e2f5e5;stroke:#25834c;stroke-width:3}.warn{fill:#fff4d4;stroke:#b98208;stroke-width:3}.t{font:bold 24px Arial,sans-serif;fill:#12452b}.s{font:18px Arial,sans-serif;fill:#254d36}.w{font:bold 32px Arial,sans-serif;fill:white}.a{stroke:#167344;stroke-width:4;fill:none;marker-end:url(#m)}.d{stroke:#b98208;stroke-width:3;fill:none;stroke-dasharray:9 8;marker-end:url(#mw)}</style><marker id="m" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#167344"/></marker><marker id="mw" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12z" fill="#b98208"/></marker></defs>
<rect class="bg" width="1200" height="1380"/><rect class="head" width="1200" height="115"/><text class="w" x="600" y="70" text-anchor="middle">FLUXOGRAMA COMPLETO — ELEIÇÃO ESCOLAR</text>
<text class="s" x="600" y="153" text-anchor="middle">Simulação eleitoral educacional • informações fictícias</text>
<rect class="soft" x="330" y="185" width="540" height="75" rx="16"/><text class="t" x="600" y="231" text-anchor="middle">Usuário abre o site no navegador</text><path class="a" d="M600 260V300"/>
<rect class="box" x="330" y="300" width="540" height="95" rx="16"/><text class="t" x="600" y="338" text-anchor="middle">Render Static Site — public/</text><text class="s" x="600" y="368" text-anchor="middle">Entrega interface web e recursos PWA</text><path class="a" d="M600 395V435"/>
<rect class="box" x="330" y="435" width="540" height="95" rx="16"/><text class="t" x="600" y="473" text-anchor="middle">Interface responsiva / PWA</text><text class="s" x="600" y="503" text-anchor="middle">Cadastro e login demonstrativos • painel • candidatos</text><path class="a" d="M600 530V570"/>
<rect class="soft" x="330" y="570" width="540" height="75" rx="16"/><text class="t" x="600" y="616" text-anchor="middle">Validação da sessão do navegador</text><path class="a" d="M600 645V685"/>
<polygon points="600,685 790,765 600,845 410,765" fill="#e2f5e5" stroke="#25834c" stroke-width="3"/><text class="t" x="600" y="758" text-anchor="middle">Já votou nesta</text><text class="t" x="600" y="788" text-anchor="middle">sessão?</text>
<path class="a" d="M790 765H920"/><text class="s" x="850" y="744" text-anchor="middle">Sim</text><rect x="920" y="715" width="240" height="100" rx="16" fill="#ffe5e5" stroke="#c33" stroke-width="3"/><text class="t" x="1040" y="757" text-anchor="middle">Bloqueia voto</text><text class="s" x="1040" y="787" text-anchor="middle">repetido</text>
<path class="a" d="M600 845V885"/><text class="s" x="630" y="873">Não</text><rect class="box" x="330" y="885" width="540" height="75" rx="16"/><text class="t" x="600" y="931" text-anchor="middle">Valida candidato e município</text><path class="a" d="M600 960V1000"/>
<rect class="box" x="330" y="1000" width="540" height="75" rx="16"/><text class="t" x="600" y="1046" text-anchor="middle">Registra voto de demonstração</text><path class="a" d="M600 1075V1115"/>
<rect class="soft" x="330" y="1115" width="540" height="75" rx="16"/><text class="t" x="600" y="1161" text-anchor="middle">API de resultados → apuração e gráficos</text>
<rect class="warn" x="40" y="300" width="245" height="250" rx="16"/><text class="t" x="162" y="342" text-anchor="middle">PWA</text><text class="s" x="162" y="385" text-anchor="middle">Manifest + Service Worker</text><text class="s" x="162" y="425" text-anchor="middle">Instalável em celular</text><text class="s" x="162" y="455" text-anchor="middle">e computador</text><text class="s" x="162" y="495" text-anchor="middle">Cache/offline conforme</text><text class="s" x="162" y="525" text-anchor="middle">recursos disponíveis</text>
<rect class="warn" x="915" y="300" width="245" height="290" rx="16"/><text class="t" x="1037" y="342" text-anchor="middle">Hospedagem</text><text class="s" x="1037" y="390" text-anchor="middle">GitHub branch main</text><text class="s" x="1037" y="420" text-anchor="middle">↓ deploy automático</text><text class="s" x="1037" y="460" text-anchor="middle">Render Static Site</text><text class="s" x="1037" y="490" text-anchor="middle">public/ publicada</text><text class="s" x="1037" y="540" text-anchor="middle">Interface online</text>
<rect class="warn" x="40" y="650" width="245" height="360" rx="16"/><text class="t" x="162" y="695" text-anchor="middle">Backend original</text><text class="s" x="162" y="740" text-anchor="middle">Netlify Functions</text><text class="s" x="162" y="770" text-anchor="middle">session • vote • results</text><text class="s" x="162" y="825" text-anchor="middle">Netlify Blobs</text><text class="s" x="162" y="865" text-anchor="middle">Armazenamento dos</text><text class="s" x="162" y="895" text-anchor="middle">votos demonstrativos</text><text class="s" x="162" y="950" text-anchor="middle">Ainda não migrado</text><text class="s" x="162" y="980" text-anchor="middle">para Render</text>
<path class="d" d="M330 1035H285V835"/>
<rect class="warn" x="915" y="900" width="245" height="290" rx="16"/><text class="t" x="1037" y="945" text-anchor="middle">Ponto pendente</text><text class="s" x="1037" y="990" text-anchor="middle">O serviço Render atual</text><text class="s" x="1037" y="1020" text-anchor="middle">é estático. A API e o</text><text class="s" x="1037" y="1050" text-anchor="middle">armazenamento precisam</text><text class="s" x="1037" y="1080" text-anchor="middle">ser migrados para uma</text><text class="s" x="1037" y="1110" text-anchor="middle">solução de backend</text><text class="s" x="1037" y="1140" text-anchor="middle">compatível com Render.</text>
<path class="d" d="M870 1152H915"/>
<rect class="head" x="40" y="1260" width="1120" height="85" rx="18"/><text class="w" x="600" y="1300" text-anchor="middle" style="font-size:24px">Demonstração educacional — não é votação oficial</text><text x="600" y="1328" text-anchor="middle" style="font:17px Arial;fill:white">Utilize apenas dados fictícios; não insira informações pessoais reais.</text>
</svg>