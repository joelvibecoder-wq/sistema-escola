 Sans,Arial,sans-serif" font-size="16" fill="#c1dacc" font-weight="450" text-anchor="start">Uma participação por conta</text><text x="944" y="1077" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacc" font-weight="450" text-anchor="start">+ cédula sem ID do eleitor.</text><rect x="1344" y="935" width="337" height="162" rx="20" fill="#1b3928" stroke="#447956" stroke-width="2" /><rect x="1362" y="953" width="53" height="43" rx="13" fill="#285a3c" stroke="#63c98c" stroke-width="2" /><text x="1388" y="983" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#d6ffe6" font-weight="850" text-anchor="middle">08</text><text x="1366" y="1027" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#e6ffee" font-weight="800" text-anchor="start">Encerrar e apurar</text><text x="1366" y="1054" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacc" font-weight="450" text-anchor="start">Resultados disponíveis após</text><text x="1366" y="1077" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacc" font-weight="450" text-anchor="start">encerramento da eleição.</text><path d="M419 816 H491" fill="none" stroke="#8be1aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M841 816 H912" fill="none" stroke="#8be1aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1263 816 H1334" fill="none" stroke="#8be1aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1505 902 V914 H246 V924" fill="none" stroke="#8be1aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M419 1017 H491" fill="none" stroke="#8be1aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M841 1017 H912" fill="none" stroke="#8be1aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1263 1017 H1334" fill="none" stroke="#8be1aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="82" y="1160" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#9af2b7" font-weight="800" text-anchor="start">4. REGRAS DE SEGURANÇA E LIMITAÇÕES</text><rect x="78" y="1180" width="452" height="180" rx="18" fill="#123124" stroke="#38684c" stroke-width="2" /><text x="101" y="1224" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#c9ffda" font-weight="800" text-anchor="start">IDENTIDADE</text><text x="101" y="1256" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacb" font-weight="450" text-anchor="start">Senhas armazenadas como hash bcrypt</text><text x="101" y="1285" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacb" font-weight="450" text-anchor="start">Cookie de sessão com HttpOnly</text><text x="101" y="1314" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacb" font-weight="450" text-anchor="start">Ativação admin por código de uso único</text><rect x="654" y="1180" width="452" height="180" rx="18" fill="#123124" stroke="#38684c" stroke-width="2" /><text x="677" y="1224" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#c9ffda" font-weight="800" text-anchor="start">VOTO</text><text x="677" y="1256" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacb" font-weight="450" text-anchor="start">Servidor valida candidato e período</text><text x="677" y="1285" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacb" font-weight="450" text-anchor="start">PK (eleição, usuário) impede repetição</text><text x="677" y="1314" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacb" font-weight="450" text-anchor="start">Participação e cédula em transação</text><rect x="1230" y="1180" width="452" height="180" rx="18" fill="#123124" stroke="#38684c" stroke-width="2" /><text x="1253" y="1224" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#c9ffda" font-weight="800" text-anchor="start">USO RESPONSÁVEL</text><text x="1253" y="1256" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacb" font-weight="450" text-anchor="start">Sem verificação de e-mail automática</text><text x="1253" y="1285" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacb" font-weight="450" text-anchor="start">Sem auditoria eleitoral independente</text><text x="1253" y="1314" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacb" font-weight="450" text-anchor="start">Somente testes; dados fictícios</text><text x="880" y="1400" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#9dbea9" font-weight="500" text-anchor="middle">Código: github.com/joelvibecoder-wq/sistema-escola  •  Produção: kennedy-vota-app.onrender.com</text></svg>