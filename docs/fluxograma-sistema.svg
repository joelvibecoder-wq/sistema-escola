tart">Sessão JWT em cookie HttpOnly</text><text x="680" y="550" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#c9e0d1" font-weight="450" text-anchor="start">bcryptjs  •  Verificação de senha</text><text x="680" y="581" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#c9e0d1" font-weight="450" text-anchor="start">Permissões: aluno, professor, admin</text><text x="680" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#c9e0d1" font-weight="450" text-anchor="start">Valida eleição, candidato e voto único</text><rect x="1286" y="410" width="395" height="245" rx="20" fill="#143022" stroke="#56876a" stroke-width="2" /><text x="1312" y="452" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#b4f4cb" font-weight="800" text-anchor="start">POSTGRESQL</text><text x="1312" y="491" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c5ded0" font-weight="450" text-anchor="start">kv_users</text><text x="1312" y="521" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c5ded0" font-weight="450" text-anchor="start">kv_admin_setup</text><text x="1312" y="551" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c5ded0" font-weight="450" text-anchor="start">kv_elections  +  kv_candidates</text><text x="1312" y="581" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c5ded0" font-weight="450" text-anchor="start">kv_participation  +  kv_ballots</text><text x="1312" y="611" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#c5ded0" font-weight="450" text-anchor="start">Persistência no Render</text><path d="M590 530 H645" fill="none" stroke="#8be1aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1225 530 H1278" fill="none" stroke="#8be1aa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="618" y="513" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#9ed1b1" font-weight="800" text-anchor="middle">HTTPS</text><text x="1254" y="511" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" fill="#9ed1b1" font-weight="800" text-anchor="middle">SQL</text><text x="82" y="711" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#9af2b7" font-weight="800" text-anchor="start">3. CICLO DE UM PROCESSO ELEITORAL</text><rect x="78" y="733" width="337" height="162" rx="20" fill="#1b3928" stroke="#447956" stroke-width="2" /><rect x="96" y="751" width="53" height="43" rx="13" fill="#285a3c" stroke="#63c98c" stroke-width="2" /><text x="122" y="781" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#d6ffe6" font-weight="850" text-anchor="middle">01</text><text x="100" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#e6ffee" font-weight="800" text-anchor="start">Criar conta</text><text x="100" y="852" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacc" font-weight="450" text-anchor="start">Aluno ou professor se cadastra</text><text x="100" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacc" font-weight="450" text-anchor="start">com e-mail/senha ou Google.</text><rect x="500" y="733" width="337" height="162" rx="20" fill="#1b3928" stroke="#447956" stroke-width="2" /><rect x="518" y="751" width="53" height="43" rx="13" fill="#285a3c" stroke="#63c98c" stroke-width="2" /><text x="544" y="781" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#d6ffe6" font-weight="850" text-anchor="middle">02</text><text x="522" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#e6ffee" font-weight="800" text-anchor="start">Aprovar pessoa</text><text x="522" y="852" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacc" font-weight="450" text-anchor="start">Administrador confirma o</text><text x="522" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacc" font-weight="450" text-anchor="start">vínculo escolar e libera acesso.</text><rect x="922" y="733" width="337" height="162" rx="20" fill="#1b3928" stroke="#447956" stroke-width="2" /><rect x="940" y="751" width="53" height="43" rx="13" fill="#285a3c" stroke="#63c98c" stroke-width="2" /><text x="966" y="781" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#d6ffe6" font-weight="850" text-anchor="middle">03</text><text x="944" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#e6ffee" font-weight="800" text-anchor="start">Preparar eleição</text><text x="944" y="852" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacc" font-weight="450" text-anchor="start">Admin cria como Planejada</text><text x="944" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacc" font-weight="450" text-anchor="start">e cadastra ao menos 2 candidatos.</text><rect x="1344" y="733" width="337" height="162" rx="20" fill="#1b3928" stroke="#447956" stroke-width="2" /><rect x="1362" y="751" width="53" height="43" rx="13" fill="#285a3c" stroke="#63c98c" stroke-width="2" /><text x="1388" y="781" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" fill="#d6ffe6" font-weight="850" text-anchor="middle">04</text><text x="1366" y="825" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#e6ffee" font-weight="800" text-anchor="start">Abrir eleição</text><text x="1366" y="852" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacc" font-weight="450" text-anchor="start">Admin abre; início e fim</text><text x="1366" y="875" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#c1dacc" font-weight="450" text-anchor="start">precisam permitir votação.</text><rect x="78" y="935" width="337" height="162" rx="20" fill="#1b3928" stroke="#447956" stroke-width="2" /><rect x="96" y="953" width="53" height="43" rx="13" fill="#285a3c" stroke="#63c98c" stroke-width="2" /><text x="122" y="983" font-family=