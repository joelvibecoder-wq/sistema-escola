# Kennedy Vota — referencia ao PostgreSQL JA EXISTENTE, sem incluir ou criar outro banco.
# Adotado apenas pelo serviço kennedy-vota-app; o site estatico anterior permanece intacto.
services:
  - type: web
    name: kennedy-vota-app
    runtime: node
    plan: free
    region: ohio
    repo: https://github.com/joelvibecoder-wq/sistema-escola
    branch: feature/google-login-animacoes-20261109
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        value: https://kennedy-vota-app.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kennedy-vota-db
          property: connectionString
# SESSION_SECRET preexistente nao deve ser sobrescrito.
# GOOGLE_CLIENT_ID e ADMIN_GOOGLE_EMAIL exigem configuracao de identidade Google.
