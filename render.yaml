services:
  - type: web
    name: eleicao-escolar-inteligente-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eleicao-escolar-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production

databases:
  - name: eleicao-escolar-db
    databaseName: eleicao_escolar_db
    user: eleicao_escolar_db_user
    plan: free
    region: ohio
    postgresMajorVersion: 16
